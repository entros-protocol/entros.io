name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The served PDF is built from a LaTeX source in another repository, so
      # nothing makes the two move together. The site served a paper four days
      # stale between 2026-08-01 and 2026-08-05 because the copy was manual.
      - name: Install poppler for the paper check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Paper PDF matches the rendered markdown
        run: node scripts/check-paper-sync.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # This is the production site. A build that only runs on Vercel is a
      # build no one sees fail until it is already failing in front of users.
      - name: Build
        run: npm run build
